
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NoteNest - สมุดโน้ต</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: #eef2ff;
      color: #1e293b;
    }
    header {
      background: #4f46e5;
      color: white;
      padding: 16px;
    }
    header h1 { margin: 0; font-size: 23px; }
    header small { opacity: .9; }
    main { max-width: 900px; margin: auto; padding: 12px; }
    .toolbar {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      margin: 8px 0;
    }
    button, select, input { font: inherit; }
    button, select {
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      padding: 10px;
      background: white;
      color: #1e293b;
    }
    button { cursor: pointer; }
    button.active {
      background: #4f46e5;
      color: white;
      border-color: #4f46e5;
    }
    button:disabled { opacity: .4; }
    #bookSelect { max-width: 170px; }
    #color {
      width: 43px;
      height: 43px;
      padding: 3px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      background: white;
    }
    #size { width: 90px; }
    .paper {
      position: relative;
      width: 100%;
      height: 68vh;
      min-height: 380px;
      max-height: 900px;
      overflow: hidden;
      background: white;
      border: 1px solid #cbd5e1;
      border-radius: 12px;
      box-shadow: 0 4px 16px #1e293b13;
    }
    .paper.lines {
      background: repeating-linear-gradient(
        to bottom,
        white 0,
        white 27px,
        #cbd5e1 28px
      );
    }
    .paper.grid {
      background-image:
        linear-gradient(#e2e8f0 1px, transparent 1px),
        linear-gradient(90deg, #e2e8f0 1px, transparent 1px);
      background-size: 25px 25px;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }
    #status {
      font-size: 13px;
      color: #475569;
      margin: 10px 2px;
    }
  </style>
</head>
<body>
  <header>
    <h1>📒 NoteNest</h1>
    <small>สมุดโน้ตสำหรับ iOS และ Android</small>
  </header>

  <main>
    <div class="toolbar">
      <select id="bookSelect" aria-label="เลือกสมุด"></select>
      <button id="newBook">＋ สมุดใหม่</button>
      <button id="prev">◀</button>
      <span id="pageNumber">1 / 1</span>
      <button id="next">▶</button>
      <button id="newPage">＋ หน้า</button>
    </div>

    <div class="toolbar">
      <button class="active" data-tool="pen">✏️ ปากกา</button>
      <button data-tool="highlighter">🖍️ ไฮไลต์</button>
      <button data-tool="erase">🧽 ยางลบ</button>
      <input id="color" type="color" value="#1e293b">
      <label>
        ขนาด
        <input id="size" type="range" min="2" max="22" value="4">
      </label>
    </div>

    <div class="toolbar">
      <select id="template">
        <option value="lines">กระดาษมีเส้น</option>
        <option value="grid">กระดาษตาราง</option>
        <option value="blank">กระดาษเปล่า</option>
      </select>
      <button id="undo">↶ ย้อนกลับ</button>
      <button id="redo">↷ ทำซ้ำ</button>
      <button id="clear">ล้างหน้านี้</button>
      <button id="export">⬇ บันทึก PNG</button>
    </div>

    <div id="paper" class="paper lines">
      <canvas id="canvas"></canvas>
    </div>
    <div id="status">
      ข้อมูลบันทึกในเบราว์เซอร์ของอุปกรณ์นี้เท่านั้น
    </div>
  </main>

  <script>
    const KEY = 'notenest-notes-v1';
    const $ = id => document.getElementById(id);
    const makePage = () => ({
      template: 'lines',
      strokes: []
    });
    const makeBook = name => ({
      id: String(Date.now()) + Math.random(),
      name,
      pages: [makePage()]
    });

    let data;
    try {
      data = JSON.parse(localStorage.getItem(KEY));
    } catch (_) {}

    if (!data || !Array.isArray(data.books) || !data.books.length) {
      const book = makeBook('สมุดเล่มแรก');
      data = {
        books: [book],
        bookId: book.id,
        pageIndex: 0
      };
    }

    let tool = 'pen';
    let drawing = false;
    let currentStroke = null;
    let redoStack = [];

    const canvas = $('canvas');
    const ctx = canvas.getContext('2d');
    let dpr = 1;

    function book() {
      return data.books.find(b => b.id === data.bookId)
        || data.books[0];
    }

    function page() {
      return book().pages[data.pageIndex];
    }

    function save() {
      try {
        localStorage.setItem(KEY, JSON.stringify(data));
        $('status').textContent =
          '✓ บันทึกแล้วในเครื่องนี้ (ยังไม่ซิงก์ข้ามเครื่อง)';
      } catch (e) {
        $('status').textContent =
          '⚠ บันทึกไม่สำเร็จ: พื้นที่เก็บข้อมูลอาจเต็ม';
      }
    }

    function updateUI() {
      const select = $('bookSelect');
      select.replaceChildren();

      data.books.forEach(b => {
        const option = document.createElement('option');
        option.value = b.id;
        option.textContent = b.name;
        select.appendChild(option);
      });

      select.value = book().id;
      $('pageNumber').textContent =
        `${data.pageIndex + 1} / ${book().pages.length}`;

      $('prev').disabled = data.pageIndex === 0;
      $('next').disabled =
        data.pageIndex >= book().pages.length - 1;

      $('undo').disabled = !page().strokes.length;
      $('redo').disabled = !redoStack.length;
      $('template').value = page().template;
      $('paper').className = 'paper ' + page().template;

      document.querySelectorAll('[data-tool]').forEach(b => {
        b.classList.toggle(
          'active',
          b.dataset.tool === tool
        );
      });
    }

    function drawStroke(target, stroke, w, h) {
      const points = stroke.points;
      if (!points.length) return;

      target.save();
      target.globalCompositeOperation =
        stroke.tool === 'erase'
          ? 'destination-out'
          : 'source-over';

      target.globalAlpha =
        stroke.tool === 'highlighter' ? 0.28 : 1;

      target.strokeStyle = stroke.color;
      target.fillStyle = stroke.color;
      target.lineWidth =
        stroke.tool === 'erase' ? 26 :
        stroke.tool === 'highlighter' ? 18 :
        stroke.size;

      target.lineCap = 'round';
      target.lineJoin = 'round';
      target.beginPath();
      target.moveTo(points[0][0] * w, points[0][1] * h);

      if (points.length === 1) {
        target.arc(
          points[0][0] * w,
          points[0][1] * h,
          target.lineWidth / 2,
          0,
          Math.PI * 2
        );
        target.fill();
      } else {
        for (let i = 1; i < points.length; i++) {
          target.lineTo(
            points[i][0] * w,
            points[i][1] * h
          );
        }
        target.stroke();
      }
      target.restore();
    }

    function redraw() {
      const w = canvas.clientWidth;
      const h = canvas.clientHeight;
      ctx.clearRect(0, 0, w, h);

      page().strokes.forEach(s => {
        drawStroke(ctx, s, w, h);
      });

      if (currentStroke) {
        drawStroke(ctx, currentStroke, w, h);
      }
    }

    function resizeCanvas() {
      const w = canvas.clientWidth;
      const h = canvas.clientHeight;
      if (!w || !h) return;

      dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.round(w * dpr);
      canvas.height = Math.round(h * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      redraw();
    }

    function point(e) {
      const r = canvas.getBoundingClientRect();
      return [
        Math.max(0, Math.min(1,
          (e.clientX - r.left) / r.width)),
        Math.max(0, Math.min(1,
          (e.clientY - r.top) / r.height))
      ];
    }

    canvas.addEventListener('pointerdown', e => {
      if (e.pointerType === 'mouse' && e.button !== 0) {
        return;
      }
      e.preventDefault();
      drawing = true;

      currentStroke = {
        tool,
        color: $('color').value,
        size: Number($('size').value),
        points: [point(e)]
      };

      canvas.setPointerCapture(e.pointerId);
      redraw();
    });

    canvas.addEventListener('pointermove', e => {
      if (!drawing || !currentStroke) return;
      e.preventDefault();
      currentStroke.points.push(point(e));
      redraw();
    });

    function finish() {
      if (!drawing || !currentStroke) return;

      page().strokes.push(currentStroke);
      currentStroke = null;
      drawing = false;
      redoStack = [];

      save();
      updateUI();
      redraw();
    }

    canvas.addEventListener('pointerup', finish);
    canvas.addEventListener('pointercancel', finish);

    document.querySelectorAll('[data-tool]').forEach(button => {
      button.addEventListener('click', () => {
        tool = button.dataset.tool;
        updateUI();
      });
    });

    $('newBook').onclick = () => {
      const name = prompt('ตั้งชื่อสมุดใหม่');
      if (!name || !name.trim()) return;

      const b = makeBook(name.trim());
      data.books.push(b);
      data.bookId = b.id;
      data.pageIndex = 0;

      redoStack = [];
      save();
      updateUI();
      redraw();
    };

    $('bookSelect').onchange = e => {
      data.bookId = e.target.value;
      data.pageIndex = 0;
      redoStack = [];
      save();
      updateUI();
      redraw();
    };

    $('prev').onclick = () => changePage(-1);
    $('next').onclick = () => changePage(1);

    function changePage(delta) {
      const n = data.pageIndex + delta;
      if (n < 0 || n >= book().pages.length) return;

      data.pageIndex = n;
      redoStack = [];
      save();
      updateUI();
      redraw();
    }

    $('newPage').onclick = () => {
      book().pages.push(makePage());
      data.pageIndex = book().pages.length - 1;
      redoStack = [];
      save();
      updateUI();
      redraw();
    };

    $('template').onchange = e => {
      page().template = e.target.value;
      save();
      updateUI();
    };

    $('undo').onclick = () => {
      const s = page().strokes.pop();
      if (!s) return;

      redoStack.push(s);
      save();
      updateUI();
      redraw();
    };

    $('redo').onclick = () => {
      const s = redoStack.pop();
      if (!s) return;

      page().strokes.push(s);
      save();
      updateUI();
      redraw();
    };

    $('clear').onclick = () => {
      if (!confirm('ล้างลายเส้นทั้งหมดในหน้านี้?')) {
        return;
      }
      page().strokes = [];
      redoStack = [];
      save();
      updateUI();
      redraw();
    };

    $('export').onclick = () => {
      const out = document.createElement('canvas');
      out.width = canvas.width;
      out.height = canvas.height;

      const c = out.getContext('2d');
      const w = canvas.clientWidth;
      const h = canvas.clientHeight;

      c.setTransform(dpr, 0, 0, dpr, 0, 0);
      c.fillStyle = '#fff';
      c.fillRect(0, 0, w, h);
      c.strokeStyle = '#cbd5e1';
      c.lineWidth = 1;

      if (page().template === 'lines') {
        for (let y = 28; y < h; y += 28) {
          c.beginPath();
          c.moveTo(0, y);
          c.lineTo(w, y);
          c.stroke();
        }
      } else if (page().template === 'grid') {
        for (let x = 0; x < w; x += 25) {
          c.beginPath();
          c.moveTo(x, 0);
          c.lineTo(x, h);
          c.stroke();
        }
        for (let y = 0; y < h; y += 25) {
          c.beginPath();
          c.moveTo(0, y);
          c.lineTo(w, y);
          c.stroke();
        }
      }

      c.drawImage(canvas, 0, 0, w, h);

      const a = document.createElement('a');
      a.href = out.toDataURL('image/png');
      a.download = `NoteNest-page-${data.pageIndex + 1}.png`;
      document.body.appendChild(a);
      a.click();
      a.remove();
    };

    updateUI();
    new ResizeObserver(resizeCanvas).observe($('paper'));
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();
  </script>
</body>
</html>
